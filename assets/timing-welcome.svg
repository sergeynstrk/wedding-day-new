    <!-- Rising bubbles -->
    <circle cx="996" cy="480" r="15" fill="#ffffff" />
    <circle cx="951" cy="434" r="18" fill="#ffffff" />
    <circle cx="984" cy="396" r="13" fill="#ffffff" />
    <!-- Ribbon bow on stem -->
    <path d="M962 704 C916 676 888 700 902 734 C916 758 952 736 964 718" fill="#ffffff" />
    <path d="M990 704 C1036 676 1064 700 1050 734 C1036 758 1000 736 988 718" fill="#ffffff" />
