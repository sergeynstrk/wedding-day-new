    <path d="M574 704 C620 676 648 700 634 734 C620 758 584 736 572 718" fill="#ffffff" />
    <path d="M548 718 L510 784" fill="none" />
    <path d="M572 718 L610 784" fill="none" />
    <circle cx="560" cy="712" r="18" fill="#ffffff" />
  </g>

  <!-- Right champagne flute (tilted inward -11deg symmetrically) -->
  <g transform="translate(976 560) rotate(-11) translate(-976 -560)" stroke="#000000" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base -->
