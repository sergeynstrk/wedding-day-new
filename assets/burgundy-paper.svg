<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1500" viewBox="0 0 960 1500">
  <defs>
    <!-- Мягкое размытие для естественных теней и световых бликов на заломах -->
    <filter id="softCrease" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="fineCrease" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <!-- Текстура хлопковых волокон ватмана (мелкое зерно качественной бумаги без цифрового шума) -->
    <filter id="cottonTooth" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.05" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.96
        0 0 0 0 0.88
        0 0 0 0 0.84
        0 0 0 0.038 0" result="coloredTooth"/>
      <feBlend mode="overlay" in="SourceGraphic" in2="coloredTooth"/>
    </filter>

    <!-- Плавные градиенты лёгкой светотеневой помятости плоскостей ватмана -->
    <radialGradient id="planeLight1" cx="30%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#fff2e0" stop-opacity="0.055"/>
      <stop offset="60%" stop-color="#fff2e0" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#fff2e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planeLight2" cx="75%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#fff0da" stop-opacity="0.048"/>
      <stop offset="55%" stop-color="#fff0da" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#fff0da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planeShadow1" cx="65%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#180209" stop-opacity="0.09"/>
      <stop offset="70%" stop-color="#180209" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#180209" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planeShadow2" cx="25%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#1a030a" stop-opacity="0.08"/>
      <stop offset="65%" stop-color="#1a030a" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#1a030a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Базовый благородный бордовый тон -->
  <rect width="960" height="1500" fill="#681427"/>

  <!-- Крупные светотеневые плоскости мятого листа (объём и игра света) -->
  <rect width="960" height="1500" fill="url(#planeLight1)"/>
  <rect width="960" height="1500" fill="url(#planeShadow1)"/>
  <rect width="960" height="1500" fill="url(#planeLight2)"/>
  <rect width="960" height="1500" fill="url(#planeShadow2)"/>

  <!-- Линии замятия бумаги (светлая грань изгиба + мягкая тень рядом) -->
  <!-- 1. Главный диагональный мягкий залом в верхней части -->
  <g filter="url(#softCrease)">
    <!-- Теневая сторона залома -->
    <path d="M -40 280 Q 220 340, 390 510 T 780 720" fill="none" stroke="#180208" stroke-width="7" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M 390 510 Q 560 620, 990 690" fill="none" stroke="#180208" stroke-width="5" stroke-opacity="0.14" stroke-linecap="round"/>
    <!-- Светлая кромка гребня залома (чуть смещена вверх к свету) -->
    <path d="M -40 275 Q 220 335, 390 504 T 780 714" fill="none" stroke="#fff4e0" stroke-width="4" stroke-opacity="0.11" stroke-linecap="round"/>
    <path d="M 390 504 Q 560 615, 990 685" fill="none" stroke="#fff4e0" stroke-width="3" stroke-opacity="0.09" stroke-linecap="round"/>
  </g>

  <!-- 2. Второй встречный залом в нижней половине (эффект слегка сложенного листа) -->
  <g filter="url(#softCrease)">
    <!-- Теневая бороздка -->
    <path d="M 1000 960 Q 720 910, 560 1060 T 140 1280" fill="none" stroke="#180208" stroke-width="6.5" stroke-opacity="0.16" stroke-linecap="round"/>
    <!-- Светлый гребень -->
    <path d="M 1000 954 Q 720 904, 560 1054 T 140 1274" fill="none" stroke="#fff4e0" stroke-width="3.8" stroke-opacity="0.10" stroke-linecap="round"/>
  </g>

  <!-- 3. Дополнительные тонкие локальные прожилки замятия (тонкие стрелки изгиба) -->
  <g filter="url(#fineCrease)">
    <!-- Короткий изгиб у края сверху справа -->
    <path d="M 780 -20 Q 710 160, 760 290" fill="none" stroke="#180208" stroke-width="4.5" stroke-opacity="0.12" stroke-linecap="round"/>
    <path d="M 777 -20 Q 707 158, 757 288" fill="none" stroke="#fff4e0" stroke-width="2.5" stroke-opacity="0.08" stroke-linecap="round"/>

    <!-- Диагональный залом по центру -->
    <path d="M 280 430 Q 340 560, 240 760" fill="none" stroke="#180208" stroke-width="4" stroke-opacity="0.11" stroke-linecap="round"/>
    <path d="M 277 428 Q 337 558, 237 758" fill="none" stroke="#fff4e0" stroke-width="2.2" stroke-opacity="0.07" stroke-linecap="round"/>

    <!-- Мягкий излом внизу слева -->
    <path d="M 60 1480 Q 210 1370, 220 1220" fill="none" stroke="#180208" stroke-width="5" stroke-opacity="0.13" stroke-linecap="round"/>
    <path d="M 62 1475 Q 212 1366, 222 1216" fill="none" stroke="#fff4e0" stroke-width="2.8" stroke-opacity="0.08" stroke-linecap="round"/>
  </g>

  <!-- Финишная фактура хлопкового ватмана -->
  <rect width="960" height="1500" filter="url(#cottonTooth)" fill="#681427" opacity="0.45" mix-blend-mode="overlay"/>
</svg>
