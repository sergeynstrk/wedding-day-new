<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Бесшовная ровная фактура хлопкового художественного ватмана -->
    <filter id="whatmanTooth" x="0%" y="0%" width="100%" height="100%">
      <!-- 1. Мелкозернистая фактура бумаги (cold-press paper grain) -->
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="fineNoise"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.98
        0 0 0 0 0.90
        0 0 0 0 0.84
        0 0 0 0.042 0" in="fineNoise" result="lightTooth"/>

      <!-- 2. Мягкие естественные волокна хлопка/целлюлозы -->
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.16" numOctaves="3" stitchTiles="stitch" result="fiberNoise"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.12
        0 0 0 0 0.02
        0 0 0 0 0.04
        0 0 0 0.045 0" in="fiberNoise" result="darkFibers"/>

      <!-- Слияние с базовым слоем -->
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="darkFibers"/>
        <feMergeNode in="lightTooth"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Базовый насыщенный бордовый фон ватмана с фактурой -->
  <rect width="400" height="400" fill="#681427" filter="url(#whatmanTooth)"/>
</svg>
