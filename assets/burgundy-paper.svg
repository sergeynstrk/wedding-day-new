<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <filter id="whatmanDistantTooth" x="0%" y="0%" width="100%" height="100%">
      <!-- Ультра-мелкое зерно хлопковой бумаги (взгляд издалека, без грубых волокон) -->
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="microTooth"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.96
        0 0 0 0 0.90
        0 0 0 0 0.85
        0 0 0 0.032 0" in="microTooth" result="lightGrain"/>

      <!-- Деликатная естественная вариация плотности листа (абсолютно бесшовная) -->
      <feTurbulence type="fractalNoise" baseFrequency="0.2" numOctaves="2" stitchTiles="stitch" result="softCloud"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.10
        0 0 0 0 0.01
        0 0 0 0 0.03
        0 0 0 0.022 0" in="softCloud" result="darkGrain"/>

      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="darkGrain"/>
        <feMergeNode in="lightGrain"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Чистый исходный бордовый цвет #681427 -->
  <rect width="300" height="300" fill="#681427" filter="url(#whatmanDistantTooth)"/>
</svg>