    <polygon points="-20,740 150,690 90,880 190,990 160,1120 -20,1180" fill="#fff4e5" fill-opacity="0.045"/>
    <polygon points="260,860 480,930 390,1040 330,1260 160,1120 190,990" fill="#0d0104" fill-opacity="0.08"/>
